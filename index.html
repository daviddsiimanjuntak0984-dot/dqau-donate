<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="description" content="Platform apresiasi karya dan dukungan untuk para kreator Indonesia.">
  <meta property="og:title" content="Dqua Donate — Dukung Kreator">

  <!-- Fonts: Inter & Poppins for cyber anime social look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Poppins', 'Inter', 'sans-serif'],
          }
        }
      }

  <style>
    html, body { min-height: 100%; background: #0b0912; }
    .app-boot-loader { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #ded7ef; font: 500 14px/1.5 system-ui, sans-serif; }
    .app-boot-spinner { width: 30px; height: 30px; border: 3px solid rgba(196,181,253,.2); border-top-color: #a78bfa; border-radius: 50%; animation: dqua-boot-spin .8s linear infinite; }
    @keyframes dqua-boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .app-boot-spinner { animation: none; border-top-color: #a78bfa; } }
  </style>
  <meta property="og:image" content="/icon.svg">

<body>
  <div id="root">
    <div class="app-boot-loader" role="status" aria-live="polite">
